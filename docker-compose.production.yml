services:
  api:
    build:
      context: .
      dockerfile: src/Storykeeper.Api/Dockerfile.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Storykeeper: Data Source=/data/storykeeper.db
      Storykeeper__Ai__BaseUrl: ${STORYKEEPER_AI_BASE_URL:-}
      Storykeeper__Ai__Model: ${STORYKEEPER_AI_MODEL:-}
      Storykeeper__Ai__ApiKey: ${STORYKEEPER_AI_API_KEY:-}
      Storykeeper__Ai__TimeoutSeconds: ${STORYKEEPER_AI_TIMEOUT_SECONDS:-60}
      Storykeeper__ParentPin: ${STORYKEEPER_PARENT_PIN:-}
      TextToSpeech__Enabled: ${TEXT_TO_SPEECH_ENABLED:-false}
      TextToSpeech__Provider: ${TEXT_TO_SPEECH_PROVIDER:-Disabled}
      TextToSpeech__BaseUrl: ${TEXT_TO_SPEECH_BASE_URL:-}
      TextToSpeech__ApiKey: ${TEXT_TO_SPEECH_API_KEY:-}
      TextToSpeech__Model: ${TEXT_TO_SPEECH_MODEL:-}
      TextToSpeech__NarratorVoice: ${TEXT_TO_SPEECH_NARRATOR_VOICE:-}
      TextToSpeech__OutputFormat: ${TEXT_TO_SPEECH_OUTPUT_FORMAT:-mp3_44100_128}
      TextToSpeech__TimeoutSeconds: ${TEXT_TO_SPEECH_TIMEOUT_SECONDS:-30}
      TextToSpeech__CacheEnabled: ${TEXT_TO_SPEECH_CACHE_ENABLED:-true}
      TextToSpeech__CacheDirectory: ${TEXT_TO_SPEECH_CACHE_DIRECTORY:-/data/tts-cache}
    expose:
      - "8080"
    volumes:
      - storykeeper-production-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/Storykeeper.Web/Dockerfile.production
    expose:
      - "80"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - api
      - web
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public Storykeeper hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for certificate notices}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - storykeeper-caddy-data:/data
      - storykeeper-caddy-config:/config
    restart: unless-stopped

volumes:
  storykeeper-production-data:
  storykeeper-caddy-data:
  storykeeper-caddy-config:
